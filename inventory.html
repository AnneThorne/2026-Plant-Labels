  body { font-family: "DM Sans", sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }
  header {

  header h1 { font-family: "DM Serif Display", serif; font-size: 1.3rem; color: var(--cream); }
  header h1 span { color: var(--green-light); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  #lock-btn {
    font-size: 0.78rem; color: var(--green-light); cursor: pointer; padding: 6px 12px;
    border: 1px solid var(--green-mid); border-radius: 20px; transition: all 0.2s; background: none;
    font-family: "DM Sans", sans-serif;
  }
  #lock-btn:hover { background: rgba(255,255,255,0.1); }
  #lock-btn.unlocked { color: var(--gold); border-color: var(--gold); }
  #export-btn {

    font-family: "DM Sans", sans-serif; font-weight: 500; background: var(--green-light);
    color: var(--green-dark); transition: all 0.2s;
  }
  #export-btn:hover { background: var(--green-mid); color: white; }
  .summary-bar {

    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .scard {
    background: white; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 18px; min-width: 110px; text-align: center; box-shadow: 0 1px 4px var(--shadow);
  }
  .scard .num { font-family: "DM Serif Display", serif; font-size: 1.5rem; color: var(--green-dark); line-height: 1; }
  .scard .num.warn { color: var(--clay); }
  .scard .num.gold { color: var(--gold); }
  .scard .lbl { font-size: 0.68rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }
  .toolbar {
    background: white; border-bottom: 1px solid var(--border); padding: 10px 28px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 340px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
  #search {
    width: 100%; padding: 7px 10px 7px 32px; border: 1px solid var(--border); border-radius: 8px;
    font-family: "DM Sans", sans-serif; font-size: 0.85rem; background: var(--green-faint); color: var(--text); outline: none;
  }
  #search:focus { border-color: var(--green-mid); }
  .fbtn {
    padding: 6px 13px; border-radius: 20px; border: 1px solid var(--border); background: white;
    font-family: "DM Sans", sans-serif; font-size: 0.8rem; color: var(--text-mid); cursor: pointer; transition: all 0.15s;
  }
  .fbtn.active { background: var(--green-dark); color: white; border-color: var(--green-dark); }
  .fbtn:hover:not(.active) { border-color: var(--green-mid); color: var(--green-dark); }
  .spacer { flex: 1; }
  .showing { font-size: 0.78rem; color: var(--text-light); white-space: nowrap; }
  .showing strong { color: var(--green-dark); }
  .table-wrap { overflow-x: auto; padding: 0 28px 32px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th {
    background: var(--green-dark); color: var(--cream); padding: 9px 10px; text-align: left;
    font-weight: 500; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em;
    white-space: nowrap; position: sticky; top: 54px; z-index: 10;
  }
  thead th.num-col { text-align: center; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--green-faint); }
  tbody tr.zero-row td { color: var(--text-light); }
  tbody td { padding: 8px 10px; vertical-align: middle; }
  .pname { font-weight: 500; }
  .psci { font-style: italic; font-size: 0.78rem; color: var(--text-mid); }
  .pdetail { font-size: 0.75rem; color: var(--text-light); }
  .num-cell { text-align: center; }
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 0.72rem; font-weight: 600;
  }
  .badge.total { background: var(--green-pale); color: var(--green-dark); }
  .badge.binder { background: #e8f0ff; color: #2d4a8a; }
  .badge.blue { background: #e8f4ff; color: #1a5276; }
  .badge.more { background: #fff8e1; color: #7d6608; }
  .badge.zero { background: #f5f5f5; color: var(--text-light); }
  .count-controls { display: flex; align-items: center; gap: 5px; justify-content: center; }
  .cbtn {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: white;
    cursor: pointer; font-size: 0.95rem; color: var(--green-dark); display: flex; align-items: center;
    justify-content: center; transition: all 0.13s; font-weight: 700; line-height: 1;
  }
  .cbtn:hover { background: var(--green-pale); border-color: var(--green-mid); }
  .cbtn.dec:hover { background: var(--red-pale); border-color: var(--red); color: var(--red); }
  .cbtn:disabled { opacity: 0.25; cursor: not-allowed; }
  .cval { min-width: 32px; text-align: center; font-family: "DM Serif Display", serif; font-size: 1.05rem; color: var(--green-dark); }
  .cval.zero { color: var(--text-light); }
  .pqty { width: 50px; padding: 3px 5px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.82rem; text-align: center; background: var(--green-faint); }
  .pqty:focus { outline: none; border-color: var(--green-mid); }
  .pbtn {
    padding: 4px 9px; background: var(--green-dark); color: white; border: none; border-radius: 6px;
    font-size: 0.75rem; cursor: pointer; font-family: "DM Sans", sans-serif; white-space: nowrap;
  }
  .pbtn:hover { background: var(--green-mid); }
  .pbtn:disabled { opacity: 0.3; cursor: not-allowed; }
  .col-check { width: 32px; }
  .col-plant { min-width: 200px; }
  .col-counts { width: 210px; }
  .col-used { width: 100px; text-align: center; }
  .col-qty { width: 60px; text-align: center; }
  .col-act { width: 110px; }
  input[type="checkbox"] { accent-color: var(--green-dark); width: 15px; height: 15px; cursor: pointer; }
  .print-bar {
    position: sticky; bottom: 0; background: var(--green-pale); border-top: 1px solid var(--border);
    padding: 10px 28px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    box-shadow: 0 -2px 8px var(--shadow);
  }
  .print-bar span { font-size: 0.85rem; color: var(--text-mid); flex: 1; }
  .pbar-btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: "DM Sans", sans-serif; font-size: 0.85rem; font-weight: 500; transition: all 0.13s; }
  .pbar-btn.pri { background: var(--green-dark); color: white; }
  .pbar-btn.pri:hover { background: var(--green-mid); }
  .pbar-btn.sec { background: white; color: var(--text-mid); border: 1px solid var(--border); }
  .pbar-btn.sec:hover { border-color: var(--green-mid); color: var(--green-dark); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center;

  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal {

  .pkey {

  #toast.err { background: var(--red); }
  #empty { text-align: center; padding: 60px 28px; color: var(--text-light); }

</style>
</head>

<div id="toast"></div>

// used counts stored separately (labels actually consumed at sale)
let used = {};
let filter = 'all';
let unlocked = false;
let pinBuf = '';
let pinCb = null;

window.addEventListener('load', () => {
  try { const s = localStorage.getItem(STORAGE_KEY); if(s) used = JSON.parse(s); } catch(e){}
  updateSummary();
  render();
});

function saveUsed() { localStorage.setItem(STORAGE_KEY, JSON.stringify(used)); }

function getUsed(id) { return used[id] || 0; }

// ── SUMMARY ──────────────────────────────────────────────────────────
function updateSummary() {
  const totalLabels = PLANTS.reduce((s,p) => s + p.totalLabels, 0);
  const zero = PLANTS.filter(p => p.totalLabels === 0).length;
  const totalUsed = PLANTS.reduce((s,p) => s + getUsed(p.id), 0);
  document.getElementById('s-labels').textContent = totalLabels;
  document.getElementById('s-zero').textContent = zero;
  document.getElementById('s-used').textContent = totalUsed;
}

// ── FILTER / RENDER ───────────────────────────────────────────────────
function setF(f, btn) {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const visible = PLANTS.filter(p => {
    const mq = !q || p.line1.toLowerCase().includes(q) || p.sciName.toLowerCase().includes(q)
      || p.commonName.toLowerCase().includes(q) || p.cultivar.toLowerCase().includes(q) || p.color.toLowerCase().includes(q);
    const mf = filter==='all' || (filter==='zero' && p.totalLabels===0)
      || (filter==='has' && p.totalLabels>0) || (filter==='more' && p.hasMore==='yes');
    return mq && mf;
  });
  document.getElementById('showing').innerHTML = 'Showing <strong>'+visible.length+'</strong> of <strong>'+PLANTS.length+'</strong>';
  if(visible.length===0){ document.getElementById('empty').style.display='block'; document.getElementById('ptable').style.display='none'; return; }
  document.getElementById('empty').style.display='none';
  document.getElementById('ptable').style.display='table';
  visible.forEach(p => {
    const u = getUsed(p.id);
    const tr = document.createElement('tr');
    if(p.totalLabels===0) tr.classList.add('zero-row');
    const eid = esc(p.id);
    const countBadges =
      '<span class="badge ' + (p.totalLabels>0?'total':'zero') + '">' + p.totalLabels + ' total</span> ' +
      (p.binderLabels>0 ? '<span class="badge binder">'+p.binderLabels+' binder</span> ' : '') +
      (p.blueBox>0 ? '<span class="badge blue">'+p.blueBox+' blue</span> ' : '') +
      (p.hasMore==='yes' ? '<span class="badge more">+ more</span>' : '');
    tr.innerHTML =
      '<td class="col-check"><input type="checkbox" class="rck" data-id="'+eid+'"></td>' +
      '<td class="col-plant"><div class="pname">'+esc(p.line1)+'</div>'+
        (p.line2?'<div class="pdetail">'+esc(p.line2)+'</div>':'')+'</td>' +
      '<td class="col-counts">'+countBadges+'</td>' +
      '<td class="col-used num-cell"><div class="count-controls">'+
        '<button class="cbtn dec" onclick="changeUsed(\''']+eid+'\',\'-1\')" '+((!unlocked)?'disabled':'')+'>−</button>'+
        '<span class="cval '+(u===0?'zero':'')+'" id="uv-'+eid+'">'+u+'</span>'+
        '<button class="cbtn" onclick="changeUsed(\''']+eid+'\',\'1\')" '+((!unlocked)?'disabled':'')+'>+</button>'+
        '</div></td>' +
      '<td class="col-qty num-cell"><input class="pqty" type="number" min="1" value="'+(p.totalLabels>0?p.totalLabels:1)+'" id="pq-'+eid+'" '+((!unlocked)?'disabled':'')+'></td>' +
      '<td class="col-act"><button class="pbtn" onclick="printOne(\''']+eid+'\')" '+((!unlocked)?'disabled':'')+'>🖨 Print</button></td>';
    tbody.appendChild(tr);
  });
  updateSelInfo();
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ── USED COUNTS ───────────────────────────────────────────────────────
function changeUsed(id, d) {
  if(!unlocked){ promptPin(); return; }
  used[id] = Math.max(0, (used[id]||0) + parseInt(d));
  saveUsed();
  const sp = document.getElementById('uv-'+id);
  if(sp){ sp.textContent=used[id]; sp.className='cval'+(used[id]===0?' zero':''); }
  updateSummary();
}

// ── SELECTION ─────────────────────────────────────────────────────────
function selAll(){ const a=document.getElementById('sel-all').checked; document.querySelectorAll('.rck').forEach(c=>c.checked=a); updateSelInfo(); }
function updateSelInfo(){ const n=document.querySelectorAll('.rck:checked').length; document.getElementById('sel-info').textContent=n>0?n+' plant'+(n>1?'s':'')+' selected':'Select plants to print labels'; }
document.addEventListener('change',e=>{ if(e.target.classList.contains('rck')) updateSelInfo(); });
function clearSel(){ document.querySelectorAll('.rck').forEach(c=>c.checked=false); document.getElementById('sel-all').checked=false; updateSelInfo(); }

// ── PRINT ─────────────────────────────────────────────────────────────
function printOne(id) {
  if(!unlocked){ promptPin(()=>printOne(id)); return; }
  const p = PLANTS.find(x=>x.id===id);
  if(!p) return;
  const qty = parseInt(document.getElementById('pq-'+id)?.value)||1;
  genPDF([{plant:p,qty}]);
  toast('Printed '+qty+' label'+(qty>1?'s':'')+' for '+p.line1);
}

function printSel() {
  if(!unlocked){ promptPin(printSel); return; }
  const checked = document.querySelectorAll('.rck:checked');
  if(checked.length===0){ toast('No plants selected',true); return; }
  const items=[];
  checked.forEach(cb=>{
    const p=PLANTS.find(x=>x.id===cb.dataset.id);
    if(!p) return;
    const qty=parseInt(document.getElementById('pq-'+cb.dataset.id)?.value)||1;
    items.push({plant:p,qty});
  });
  genPDF(items);
  toast('Printed labels for '+items.length+' plant type'+(items.length>1?'s':''));
}

function genPDF(items) {
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'letter'});
  let col=0,row=0,first=true;
  const labels=[];
  items.forEach(({plant,qty})=>{ for(let i=0;i<qty;i++) labels.push(plant); });
  labels.forEach((p,idx)=>{
    if(!first && idx%(COLS*ROWS)===0){ doc.addPage(); col=0; row=0; }
    first=false;
    const x=LEFT_M+col*(LBL_W+COL_GAP), y=TOP_M+row*LBL_H;
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(p.line1,x+PAD,y+13,{maxWidth:LBL_W-PAD*2});
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    if(p.line2) doc.text(p.line2,x+PAD,y+25,{maxWidth:LBL_W-PAD*2});
    doc.setFont('helvetica','italic'); doc.setFontSize(8);
    if(p.line3) doc.text(p.line3,x+PAD,y+36,{maxWidth:LBL_W-PAD*2});
    col++; if(col>=COLS){col=0;row++;} if(row>=ROWS){row=0;}
  });
  doc.save('MG_PlantSale_Labels.pdf');
}

// ── EXPORT ────────────────────────────────────────────────────────────
function exportXlsx() {
  const rows = [["Common Name","Scientific Name","Cultivar","Color","Total Labels","Binder Labels","Blue Box","Has More","Labels Used"]];
  PLANTS.forEach(p => rows.push([p.commonName,p.sciName,p.cultivar,p.color,p.totalLabels,p.binderLabels,p.blueBox,p.hasMore,getUsed(p.id)]));
  let csv = rows.map(r => r.map(v => '"'+String(v||'')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MG_Inventory_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('Exported inventory CSV');
}

// ── PIN ───────────────────────────────────────────────────────────────
function toggleLock(){
  if(unlocked){ unlocked=false; document.getElementById('lock-btn').textContent='🔒 View Only'; document.getElementById('lock-btn').classList.remove('unlocked'); render(); }
  else promptPin();
}
function promptPin(cb){ pinBuf=''; pinCb=cb||null; updDots(); document.getElementById('perr').textContent=''; document.getElementById('pin-modal').classList.add('show'); }
function closePin(){ document.getElementById('pin-modal').classList.remove('show'); pinBuf=''; pinCb=null; }
function pp(k){
  if(k==='←') pinBuf=pinBuf.slice(0,-1);
  else if(k==='✕') pinBuf='';
  else{ if(pinBuf.length>=4) return; pinBuf+=k; }
  updDots();
  if(pinBuf.length===4) setTimeout(checkPin,100);
}
function updDots(){ for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled',i<pinBuf.length); }
function checkPin(){
  if(pinBuf===PIN){ unlocked=true; document.getElementById('lock-btn').textContent='🔓 Editing'; document.getElementById('lock-btn').classList.add('unlocked'); document.getElementById('pin-modal').classList.remove('show'); const cb=pinCb; pinBuf=''; pinCb=null; render(); if(cb) cb(); }
  else{ document.getElementById('perr').textContent='Incorrect PIN.'; pinBuf=''; updDots(); }
}

// ── TOAST ─────────────────────────────────────────────────────────────
let tt;
function toast(msg,err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(err?' err':''); clearTimeout(tt); tt=setTimeout(()=>t.className='',3000); }
</script>
